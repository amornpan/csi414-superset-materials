<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" role="img" aria-label="เทียบสองวิธีเข้าถึงข้อมูล ดูดมาเก็บไว้ กับ ถามทุกครั้ง" font-family="Leelawadee UI, Segoe UI, system-ui, sans-serif"><defs><marker id="หัวลูกศร-52514e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#52514e"/></marker><marker id="หัวลูกศร-2a78d6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2a78d6"/></marker><marker id="หัวลูกศร-e34948" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e34948"/></marker></defs><text x="20" y="26" font-size="15" font-weight="700" fill="#0b0b0b">แบบดูดข้อมูลมาเก็บไว้</text><text x="20" y="46" font-size="12.5" fill="#898781">ข้อมูลถูกคัดลอกออกมาอยู่ในไฟล์ของเครื่องมือ</text><path d="M24,101 a60.0,9 0 0,1 120,0 v68 a60.0,9 0 0,1 -120,0 z" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/><path d="M24,101 a60.0,9 0 0,0 120,0" fill="none" stroke="#52514e" stroke-width="1.4"/><text x="84.0" y="144.0" text-anchor="middle" font-size="13" fill="#52514e">ฐานข้อมูล</text><line x1="152" y1="135" x2="246" y2="135" stroke="#e34948" stroke-width="1.6" marker-end="url(#หัวลูกศร-e34948)"/><text x="199.0" y="127.0" text-anchor="middle" font-size="12" fill="#e34948">คัดลอกทั้งชุด</text><rect x="254" y="82" width="168" height="118" rx="9" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/><text x="338" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="#52514e">ไฟล์บนเครื่องคุณ</text><rect x="272" y="126" width="132" height="56" rx="6" fill="#e34948" opacity=".16"/><text x="338" y="150" text-anchor="middle" font-size="12" fill="#e34948" font-weight="600">ข้อมูลทั้งชุด</text><text x="338" y="169" text-anchor="middle" font-size="12" fill="#e34948">มาอยู่ตรงนี้</text><line x1="430" y1="141" x2="466" y2="141" stroke="#52514e" stroke-width="1.6" marker-end="url(#หัวลูกศร-52514e)"/><rect x="472" y="112" width="82" height="58" rx="9" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/><text x="513.0" y="145.68" text-anchor="middle" font-size="13" fill="#52514e">กราฟ</text><text x="24" y="228" font-size="12.5" fill="#52514e">ข้อมูลเก่าเท่าวันที่ดูดมา จนกว่าจะกด Refresh</text><text x="24" y="248" font-size="12.5" fill="#52514e">ตัดเน็ตแล้วยังเปิดกราฟได้</text><line x1="600" y1="16" x2="600" y2="324" stroke="#e1e0d9" stroke-width="1.4"/><text x="632" y="26" font-size="15" font-weight="700" fill="#0b0b0b">Apache Superset</text><text x="632" y="46" font-size="12.5" fill="#898781">ข้อมูลไม่เคยออกจากฐานข้อมูล</text><rect x="624" y="82" width="148" height="118" rx="9" fill="#ffffff" stroke="#52514e" stroke-width="1.4" stroke-dasharray="5 4"/><text x="698.0" y="129.68" text-anchor="middle" font-size="13" fill="#52514e" font-weight="600">Superset</text><text x="698.0" y="145.68" text-anchor="middle" font-size="13" fill="#52514e">เก็บแค่คำอธิบายงาน</text><text x="698.0" y="161.68" text-anchor="middle" font-size="13" fill="#52514e">ไม่เก็บข้อมูล</text><path d="M862,105 a30.0,9 0 0,1 60,0 v60 a30.0,9 0 0,1 -60,0 z" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/><path d="M862,105 a30.0,9 0 0,0 60,0" fill="none" stroke="#52514e" stroke-width="1.4"/><text x="892.0" y="144.0" text-anchor="middle" font-size="13" fill="#52514e"></text><text x="892" y="192" text-anchor="middle" font-size="12" fill="#52514e">ฐานข้อมูล</text><rect x="866" y="120" width="52" height="32" rx="5" fill="#2a78d6" opacity=".16"/><text x="892" y="141" text-anchor="middle" font-size="11" fill="#2a78d6" font-weight="600">ข้อมูล</text><line x1="780" y1="112" x2="856" y2="112" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#หัวลูกศร-2a78d6)"/><text x="818.0" y="104.0" text-anchor="middle" font-size="12" fill="#2a78d6">ส่ง SQL</text><line x1="856" y1="168" x2="780" y2="168" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#หัวลูกศร-2a78d6)"/><text x="818.0" y="184.0" text-anchor="middle" font-size="12" fill="#2a78d6">ผลสรุป</text><rect x="624" y="224" width="82" height="52" rx="9" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/><text x="665.0" y="254.68" text-anchor="middle" font-size="13" fill="#52514e">กราฟ</text><line x1="680" y1="204" x2="668" y2="220" stroke="#52514e" stroke-width="1.6" marker-end="url(#หัวลูกศร-52514e)"/><text x="722" y="246" font-size="12.5" fill="#52514e">กราฟใหม่เสมอโดยไม่ต้องกดอะไร</text><text x="722" y="266" font-size="12.5" fill="#52514e">ฐานข้อมูลล่มเมื่อไร กราฟขึ้นไม่ได้</text><text x="624" y="312" font-size="12.5" fill="#898781">ความต่างอยู่ที่ <tspan font-weight="600" fill="#52514e">ข้อมูลข้ามเส้นไปกี่ครั้ง</tspan> ไม่ได้อยู่ที่หน้าตาโปรแกรม</text>
</svg>
